[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topoopt"
version = "0.1.0"
description = "Lightweight 2D structural topology optimization: a reference implementation of SIMP minimum compliance on a structured Q4 mesh"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["topoopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
