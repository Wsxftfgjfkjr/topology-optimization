[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topoopt"
version = "0.1.0"
description = "Lightweight 2D structural topology optimization: a reference implementation of SIMP minimum compliance on a structured Q4 mesh"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# The HTTP backend.  Kept out of the core dependencies so that using the solver
# as a library does not pull in a web stack.
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
# Everything needed to run the test suite, including the API tests.  Starlette's
# TestClient now prefers httpx2 and warns when it falls back to httpx, but the
# fallback works; plain httpx is the conventional FastAPI stack and is used here
# deliberately.  See the note in the README.
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

# An explicit list rather than auto-discovery: the repository also holds
# benchmarks/, tests/ and docs/, which are not importable packages.  ``examples``
# is deliberately not installed -- the API depends only on ``topoopt``.
[tool.setuptools]
packages = ["topoopt", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
